name: Update YouTube Playlist

on:
  schedule:
    - cron: '0 18 * * *'  # 03:00 JST daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Update playlist.json
        run: python scripts/update_playlist.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- playlist.json; then
            echo "No changes to commit."
          else
            git add playlist.json
            git commit -m "chore: update YouTube playlist data"
            git push
          fi
