<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROFILE | GYU-P Official</title>
    <link rel="icon" href="新アイコン背景なし.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        @keyframes rainbow-border-flow {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }
        body {
            background-color: #121212; color: #EAEAEA;
            font-family: 'Montserrat', 'Noto Sans JP', sans-serif;
            margin: 0;
            cursor: crosshair;
            /* ★★★ スクロールを有効にするため overflow: hidden; を削除 ★★★ */
        }
        #particle-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
        }
        .page-header {
            position: fixed; top: 25px; left: 30px; z-index: 10;
        }
        .page-header .icon-container {
            position: relative; display: inline-block; border-radius: 50%;
            padding: 2px; background: #555; transform: scale(1);
            transition: transform 0.4s ease, background 0.4s ease; cursor: pointer;
        }
        .page-header .icon-container:hover {
            transform: scale(1.1);
            background: linear-gradient(45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: rainbow-border-flow 2s ease-in-out infinite;
        }
        .page-header .icon-container::before {
            content: ''; position: absolute; top: 2px; left: 2px; right: 2px; bottom: 2px;
            background-color: #121212; border-radius: 50%; z-index: 1;
        }
        .page-header .artist-icon {
            position: relative; z-index: 2; display: block;
            width: 45px; height: 45px;
            border-radius: 50%; object-fit: cover;
        }
        .content-wrapper {
             /* ★★★ スクロールに対応するためレイアウトを修正 ★★★ */
            padding: 100px 40px 120px;
            max-width: 960px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        .page-title {
            font-size: clamp(36px, 6vw, 54px);
            font-weight: 300; text-align: center;
            letter-spacing: 0.05em; margin-bottom: 40px;
        }
        .profile-content {
            display: flex; flex-wrap: wrap;
            gap: 40px; align-items: center;
            justify-content: center;
        }
        
        .profile-image-container {
            flex-basis: 300px;
            flex-grow: 0;
            height: 300px;
            border-radius: 50%;
            background-color: #FFFFFF;
            border: 3px solid #555;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-text-container {
            flex: 2; min-width: 300px;
        }
        .profile-text-container h3 {
            font-size: 22px; font-weight: 400; letter-spacing: 0.08em;
            padding-bottom: 10px; border-bottom: 1px solid #333; margin-bottom: 20px;
        }
        .profile-text-container p {
            color: #FFFFFF;
            line-height: 2.0;
        }
        .contact-info { margin-top: 40px; }
        .contact-info a { color: #EAEAEA; text-decoration: none; transition: color 0.3s; }
        .contact-info a:hover { color: #fff; text-decoration: underline; }
        .page-footer {
            /* ★★★ フッターの固定を解除 ★★★ */
            text-align: center; 
            padding: 40px;
            border-top: 1px solid #222;
        }
        .page-footer a {
            font-family: 'Montserrat', sans-serif; font-weight: 400; font-size: 14px;
            color: #888888; text-decoration: none; margin: 0 20px;
            letter-spacing: 0.1em; transition: color 0.4s ease, letter-spacing 0.4s ease;
        }
        .page-footer a:hover { color: #FFFFFF; letter-spacing: 0.2em; }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <header class="page-header">
        <a href="index.html" class="icon-container">
            <img src="新アイコン背景なし.png" alt="HOME" class="artist-icon">
        </a>
    </header>

    <main class="content-wrapper">
        <h1 class="page-title">PROFILE</h1>
        <section class="profile-content">
            <div class="profile-image-container">
                <img src="新アイコン背景なし.png" alt="プロフィール画像" class="profile-image">
            </div>
            <div class="profile-text-container">
                <h3>GYU P</h3>
                <p>
                    2006年生まれ<br>
                    オリジナル楽曲の投稿および楽曲提供など<br>
                    生楽器を使った楽曲、ノリノリな楽曲、かわいい楽曲の制作が得意です(詳細はWORKSをご覧ください)<br>
                    音楽制作に関するご依頼、お待ちしております！
                </p>
                <div class="contact-info">
                    <h3>CONTACT</h3>
                    <p>
                        ご依頼・ご連絡はこちらまで<br>
                        (XのDMからもご連絡頂けます)<br>
                        <a href="mailto:gyup.bokarop@gmail.com">gyup.bokarop@gmail.com</a>
                    </p>
                </div>
            </div>
        </section>
    </main>
    
    <footer class="page-footer">
        <a href="index.html">HOME</a>
        <a href="works.html">WORKS</a>
    </footer>
    <script>
        // カーソルアニメーション
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let points = [], hue = 0, isMoving = false, stopTimer;
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        document.body.addEventListener('mousemove', (event) => {
            isMoving = true; points.push({ x: event.clientX, y: event.clientY });
            clearTimeout(stopTimer); stopTimer = setTimeout(() => { isMoving = false; }, 50);
        });
        function animateParticles() {
            ctx.fillStyle = 'rgba(18, 18, 18, 0.3)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            if (!isMoving && points.length > 0) { points.shift(); }
            if (points.length > 10) { points.shift(); }
            if (points.length > 1) {
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) { ctx.lineTo(points[i].x, points[i].y); }
                const gradient = ctx.createLinearGradient(points[0].x, points[0].y, points[points.length - 1].x, points[points.length - 1].y);
                gradient.addColorStop(0, `hsla(${hue}, 100%, 70%, 0)`);
                gradient.addColorStop(1, `hsla(${hue + 60}, 100%, 70%, 1)`);
                ctx.strokeStyle = gradient; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
            }
            hue += 1; requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
